{% set name = "asammdf" %}
{% set version = "8.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ea7757c690cfbf1790905aa048f38d6adf6f827091679ea5cf193ba745616a4f
  patches:
    - patches/0001-unvendor-libdeflate-from-the-CMakeLists.txt.patch

build:
  number: 0
  entry_points:
    - asammdf = asammdf.app.asammdfgui:main [gui]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]
  ignore_run_exports:
    #   ERROR (asammdf): run-exports library package main/osx-arm64::numpy==2.2.2=py310h3b2db8e_0 in requirements/run but it is not used (i.e. it is overdepending or perhaps statically linked? If that is what you want then add it to `build/ignore_run_exports`)
    - numpy
  missing_dso_whitelist:
    #    INFO (asammdf,lib/python3.10/site-packages/asammdf/blocks/cutils.abi3.so): Needed DSO $RPATH/libdeflate.0.dylib found in the whitelist
    - $RPATH/libdeflate*

requirements:
  build:
    - {{ compiler('c') }}
    - cmake
    - libdeflate
  host:
    - python
    - pip
    - setuptools
    - wheel
    - scikit-build-core
    - numpy >=2.0.0
  run:
    - python
    - numpy >=2.0.0
    # Need to add in main
    - canmatrix #>=1.2
    # Need to add in main
    - isa-l
    - lxml >=4.9.3
    - lz4
    - numexpr
    - pandas
    - python-dateutil
    - typing-extensions >=4.10,<5
    - libdeflate
  run_constrained:
    - faust-cchardet ==2.1.19
    - hdf5storage >=0.1.19

test:
  source_files:
    - test
  imports:
    - asammdf
  commands:
    # python-can 4.2.2 requires msgpack, which is not installed.
    # asammdf 8.2.4 has requirement canmatrix[arxml,dbc]>=1.2, but you have canmatrix 0.9.5.
    #- pip check
    # ++++++++++++++++++++++++++++++++++++++++++++++++
    # ModuleNotFoundError: No module named 'pyqtgraph'
    - pip install pyqtlet2  #asammdf --help
    - asammdf --help
    - pip install pyautogui  # all tests using this pkg
    - pytest -v test
  requires:
    - pip
    - pytest
    - h5py
    - pyarrow
    - python-can
    - scipy
    - pyqtgraph  #asammdf --help
    - pyqt  #asammdf --help
    - pyside2  #asammdf --help
    - pyside6  #asammdf --help
    - msgpack-python  #asammdf --help
    - natsort  #asammdf --help
    - pyqtwebengine  #asammdf --help

about:
  home: https://github.com/danielhrisca/asammdf
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: ASAM MDF measurement data file parser
  description: |
    *asammdf* is a fast parser/editor for ASAM (Associtation for Standardisation of Automation and Measuring Systems) MDF (Measurement Data Format) files. \n\n*asammdf* supports MDF versions\
    \ 2 (.dat), 3 (.mdf) and 4 (.mf4). \n\n*asammdf* works on Python >= 3.8\
    GUI available that is based on pyqtgraph and PySide6
  doc_url: https://asammdf.readthedocs.io/en/master/
  dev_url: https://github.com/danielhrisca/asammdf

extra:
  recipe-maintainers:
    - danielhrisca
